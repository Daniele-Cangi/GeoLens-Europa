name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript deterministic gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Run deterministic TypeScript tests
        run: npm run test:ts

      - name: Build production workspaces
        run: npm run build

  python:
    name: Python deterministic gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEOLENS_RUN_LIVE_PROVIDER_TESTS: "0"
    defaults:
      run:
        working-directory: nasa-precip-engine
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nasa-precip-engine/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Run deterministic Python tests
        run: python -m unittest discover -s tests -v

      - name: Compile benchmark and surface-flow Python sources
        working-directory: .
        run: python -m compileall -q surface-flow-engine scripts tests/python

      - name: Run deterministic benchmark and surface-flow tests
        working-directory: .
        run: python -m unittest discover -s tests/python -v
